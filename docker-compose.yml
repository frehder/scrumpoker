services:
  scrumpoker:
    image: ${IMAGE_NAME:-scrumpoker}:${IMAGE_TAG:-latest}
    container_name: scrumpoker
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - STATS_TOKEN=${STATS_TOKEN:-}
    volumes:
      - ${VOLUME_BASE_PATH:-/opt/docker/volumes}/${APP_NAME:-scrumpoker}:/app/data
    networks:
      - caddynet
networks:
  caddynet:
    external: true
